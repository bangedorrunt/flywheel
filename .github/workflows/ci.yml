# Independent verification of captain green claims (GS-018: flywheel had no
# Actions; every local "suite green" claim was unverifiable remotely).
#
# Scope: bin tests + check/clippy/fmt are hermetic and run here. The five
# integration files that shell out to herdr/br/toron-daemon
# (e2e_serialize_worktree, e2e_verdict_reopen, event_poll_parity,
# collab_patterns_e2e, chain_unblock_conformance) are env-dependent and run
# on dev machines with the full stack adjacent; clippy --all-targets still
# compiles them so they cannot rot silently.
#
# The toron checkout is required: flywheel path-depends on ../toron/crates/*.
# GS-025: beads + toron CLIs must be on PATH (br init / toron help).
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # 2-core hosted runners OOM linking the giant flywheel binary under
  # default parallelism (GS-019: runner lost communication at 52m).
  CARGO_BUILD_JOBS: 2

jobs:
  gates:
    name: check / test(bin) / clippy / fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout flywheel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: flywheel
          # bd-0vzl: the beads-ledger gate scans commit subjects for close
          # claims, and a shallow clone would make that scan check nothing
          # while reporting OK. Full history, or the gate is theatre.
          fetch-depth: 0
      - name: Checkout sibling toron (path dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bangedorrunt/toron
          path: toron
          # bd-9bs4: pinned to a reviewed toron main head (migration 22,
          # [comms] inbox_log). Bump deliberately; do not float on main.
          ref: 2952cb28dd54834b052bab483fcd275ea9e15bdf
          # Both repos are private: the default GITHUB_TOKEN is scoped to
          # THIS repo only. The operator must set CI_TORON_TOKEN (fine-
          # grained PAT, Contents:read on bangedorrunt/toron). Until then
          # this step fails loud — do not make it optional, unverifiable
          # green is the failure GS-018 called out.
          token: ${{ secrets.CI_TORON_TOKEN }}
      - name: Checkout beads (public — br CLI)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bangedorrunt/beads
          path: beads
      - name: Install pinned nightly toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          # Shared pin with siblings beads + toron (bd-14ea). The action
          # reads rust-toolchain.toml when `toolchain` is omitted, but the
          # pin is spelled out so CI breaks loud if the file drifts.
          toolchain: nightly-2026-08-20
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            flywheel
            toron
            beads
      - name: Build br + toron CLIs onto PATH (GS-025)
        run: |
          cargo build -p beads --bin br --manifest-path beads/Cargo.toml
          cargo build -p toron-cli --bin toron --manifest-path toron/Cargo.toml
          echo "$GITHUB_WORKSPACE/beads/target/debug" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/toron/target/debug" >> "$GITHUB_PATH"
      - name: Verify br and toron on PATH
        run: which br toron
      - name: GS-043 peer-aware SoT gate
        working-directory: flywheel
        run: bash scripts/check-peer-aware-sot.sh
      - name: beads ledger regression gate (bd-0vzl)
        working-directory: flywheel
        run: bash scripts/check-beads-ledger.sh --history
      - name: cargo check
        working-directory: flywheel
        run: cargo check --workspace
      - name: cargo test (bin shards cover -- see test-shards matrix)
        working-directory: flywheel
        run: echo "bin suite runs in the test-shards matrix below"
      - name: cargo clippy
        working-directory: flywheel
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo fmt --check
        working-directory: flywheel
        run: cargo fmt --check

  test-shards:
    name: bin suite shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [durable, tick-family, engine-family, rest, slices]
    steps:
      - name: Checkout flywheel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: flywheel
      - name: Checkout sibling toron (path dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bangedorrunt/toron
          path: toron
          # bd-9bs4: pinned to a reviewed toron main head (migration 22,
          # [comms] inbox_log). Bump deliberately; do not float on main.
          ref: 2952cb28dd54834b052bab483fcd275ea9e15bdf
          token: ${{ secrets.CI_TORON_TOKEN }}
      - name: Checkout beads (public — br CLI)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bangedorrunt/beads
          path: beads
      - name: Install pinned nightly toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          # Shared pin with siblings beads + toron (bd-14ea). GS-019's
          # stable-override is retired: the pinned nightly ships rustfmt +
          # clippy, so the toolchain file resolves directly.
          toolchain: nightly-2026-08-20
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            flywheel
            toron
            beads
      - name: Build br + toron CLIs onto PATH (GS-025)
        run: |
          cargo build -p beads --bin br --manifest-path beads/Cargo.toml
          cargo build -p toron-cli --bin toron --manifest-path toron/Cargo.toml
          echo "$GITHUB_WORKSPACE/beads/target/debug" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/toron/target/debug" >> "$GITHUB_PATH"
      - name: Verify br and toron on PATH
        run: which br toron
      - name: run shard
        working-directory: flywheel
        run: |
          ulimit -v 6291456 || true
          free -g | head -2; df -h /home/runner/work | tail -1
          case "${{ matrix.shard }}" in
            durable)
              timeout 20m cargo test --bin flywheel -- durable:: ;;
            tick-family)
              timeout 20m cargo test --bin flywheel -- workspace:: doorbell:: doorbell_tick:: state:: herdr_shim:: mail_shim:: wake_identity_tests:: timeout_presence_tests:: waitcorr_doorbell_only_tests:: s_proof_tests:: renew_sweep_tests:: journal_effect_tests:: ;;
            engine-family)
              timeout 20m cargo test --bin flywheel -- integration_tests:: builtin_workflows:: decide:: loop_tests:: verdict:: models:: crew:: cron:: config:: headless:: backend:: failure:: stages:: profile:: pane:: preflight:: plane_route:: coalition:: ;;
            rest)
              timeout 20m cargo test --bin flywheel -- --skip durable:: --skip workspace:: --skip doorbell:: --skip doorbell_tick:: --skip state:: --skip herdr_shim:: --skip mail_shim:: --skip wake_identity_tests:: --skip timeout_presence_tests:: --skip waitcorr_doorbell_only_tests:: --skip s_proof_tests:: --skip renew_sweep_tests:: --skip journal_effect_tests:: --skip integration_tests:: --skip builtin_workflows:: --skip decide:: --skip loop_tests:: --skip verdict:: --skip models:: --skip crew:: --skip cron:: --skip config:: --skip headless:: --skip backend:: --skip failure:: --skip stages:: --skip profile:: --skip pane:: --skip preflight:: --skip plane_route:: --skip coalition:: ;;
            slices)
              timeout 10m cargo test --test adr0027_slice1
              timeout 10m cargo test --test adr0027_slice3
              timeout 10m cargo test --test sc_doorbell_adr0005 ;;
          esac
          echo "=== SHARD ${{ matrix.shard }} DONE ==="
