# Independent verification of captain green claims (GS-018: flywheel had no
# Actions; every local "suite green" claim was unverifiable remotely).
#
# Scope: bin tests + check/clippy/fmt are hermetic and run here. The five
# integration files that shell out to herdr/br/toron-daemon
# (e2e_serialize_worktree, e2e_verdict_reopen, event_poll_parity,
# collab_patterns_e2e, chain_unblock_conformance) are env-dependent and run
# on dev machines with the full stack adjacent; clippy --all-targets still
# compiles them so they cannot rot silently.
#
# The toron checkout is required: flywheel path-depends on ../toron/crates/*.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # 2-core hosted runners OOM linking the giant flywheel binary under
  # default parallelism (GS-019: runner lost communication at 52m).
  CARGO_BUILD_JOBS: 2

jobs:
  gates:
    name: check / test(bin) / clippy / fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout flywheel
        uses: actions/checkout@v4
        with:
          path: flywheel
      - name: Checkout sibling toron (path dependency)
        uses: actions/checkout@v4
        with:
          repository: bangedorrunt/toron
          path: toron
          # Both repos are private: the default GITHUB_TOKEN is scoped to
          # THIS repo only. The operator must set CI_TORON_TOKEN (fine-
          # grained PAT, Contents:read on bangedorrunt/toron). Until then
          # this step fails loud — do not make it optional, unverifiable
          # green is the failure GS-018 called out.
          token: ${{ secrets.CI_TORON_TOKEN }}
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            flywheel
            toron
      - name: cargo check
        working-directory: flywheel
        run: cargo check --workspace
      - name: cargo test (bin + hermetic integration suites -- S1-S4 contracts)
        working-directory: flywheel
        run: |
          # GS-019: two hosted runners died ~52m into this step with no log tail.
          # Split invocations + a 6 GiB address-space cap turn a silent OOM
          # into a visible allocation failure; markers show how far it gets.
          ulimit -v 6291456 || true
          echo "=== markers ==="
          free -g | head -2; df -h /home/runner/work | tail -1
          echo "=== shard A: durable ==="
          timeout 15m cargo test --bin flywheel -- durable::
          echo "=== shard B: tick/doorbell/wait family ==="
          timeout 15m cargo test --bin flywheel -- workspace:: doorbell:: doorbell_tick:: state:: herdr_shim:: mail_shim:: wake_identity_tests:: timeout_presence_tests:: waitcorr_doorbell_only_tests:: s_proof_tests:: renew_sweep_tests:: journal_effect_tests::
          echo "=== shard C: engine/loop/strategy family ==="
          timeout 15m cargo test --bin flywheel -- integration_tests:: builtin_workflows:: decide:: loop_tests:: verdict:: models:: crew:: cron:: config:: headless:: backend:: failure:: stages:: profile:: pane:: preflight:: plane_route:: coalition::
          echo "=== shard D: remainder ==="
          timeout 15m cargo test --bin flywheel -- --skip durable:: --skip workspace:: --skip doorbell:: --skip doorbell_tick:: --skip state:: --skip herdr_shim:: --skip mail_shim:: --skip wake_identity_tests:: --skip timeout_presence_tests:: --skip waitcorr_doorbell_only_tests:: --skip s_proof_tests:: --skip renew_sweep_tests:: --skip journal_effect_tests:: --skip integration_tests:: --skip builtin_workflows:: --skip decide:: --skip loop_tests:: --skip verdict:: --skip models:: --skip crew:: --skip cron:: --skip config:: --skip headless:: --skip backend:: --skip failure:: --skip stages:: --skip profile:: --skip pane:: --skip preflight:: --skip plane_route:: --skip coalition::
          echo "=== markers ==="
          free -g | head -2; df -h /home/runner/work | tail -1
          echo "=== slice1 ==="
          timeout 10m cargo test --test adr0027_slice1
          echo "=== slice3 ==="
          timeout 10m cargo test --test adr0027_slice3
          echo "=== sc_doorbell ==="
          timeout 10m cargo test --test sc_doorbell_adr0005
          echo "=== ALL GREEN ==="
      - name: cargo clippy
        working-directory: flywheel
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo fmt --check
        working-directory: flywheel
        run: cargo fmt --check
