\* own refused copy queues the same message and the drain rings it a second
\* time — one message, two rings.
SPECIFICATION Spec
CONSTANTS Messages = {"brief", "peer"}
          ActNow = {"brief"}
          Bug = "preempt-unrecorded"
INVARIANT AtMostOnceRung
