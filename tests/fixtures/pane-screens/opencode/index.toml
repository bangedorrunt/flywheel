# Captured from a throwaway rex session by scripts/capture-pane-corpus.sh
# (bd-0uzrq.3). Every row is a real screen, not a drawn one.
#
# expect: empty | operator-text
# last_typed: the line the wake path itself wrote into the box, if any. opencode
#   keeps the submitted text visible, so a box holding exactly that line is NOT
#   operator typing (that is the finding this corpus exists to record).

[[screen]]
file = "idle-fresh.txt"
expect = "empty"

[[screen]]
file = "partial-input.txt"
expect = "operator-text"

[[screen]]
file = "idle-cleared.txt"
expect = "empty"

[[screen]]
file = "working.txt"
expect = "empty"
last_typed = "Reply with exactly: OK"

[[screen]]
file = "idle-after-turn.txt"
expect = "empty"
last_typed = "Reply with exactly: OK"

[[screen]]
file = "modal.txt"
expect = "operator-text"
# An open command palette owns keystrokes, even when the input box is empty.

# SYNTHETIC (bd-8wdgn), not a rex capture: the box reproduced from the live
# failure holds the doorbell's own queued line. It is NOT operator typing and
# must not be treated as such.
[[screen]]
file = "wake-line-queued.txt"
expect = "wake-queued"

# bd-g4xlr: the current opencode footer ("auto <model> · <effort>") is a status
# row, not typed text. new-empty-footer is a REAL capture; new-typed-footer is
# SYNTHETIC - the same frame with one typed line inserted above the footer.
# A doorbell bubble above the box is history, not a queued wake.
[[screen]]
file = "new-empty-footer.txt"
expect = "empty"

[[screen]]
file = "new-empty-clean-footer.txt"
expect = "empty"

[[screen]]
file = "new-typed-footer.txt"
expect = "operator-text"

# An empty box above a doorbell bubble in history classifies empty.
[[screen]]
file = "boldcliff-deaf-empty-box.txt"
expect = "empty"
