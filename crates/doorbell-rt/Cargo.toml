[package]
name = "doorbell-rt"
version = "0.1.0"
edition = "2024"
description = "Doorbell runtime actors (ADR-0012 Phase 1) — single-writer brain, sensor/sink tasks, store"
license = "MIT"

[dependencies]
doorbell-core = { path = "../doorbell-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = "0.4"
# bd-ene2 FileHost: gen-hash (sha1 of first 8k, same rule as the embedded
# WatcherGen gate) + home-dir fallback for the toron data root.
sha1 = "0.10"
hex = "0.4"
dirs = "6"
