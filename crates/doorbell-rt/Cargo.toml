[package]
name = "doorbell-rt"
version = "0.2.0"
edition = "2024"
description = "Doorbell runtime actors (ADR-0012 Phase 1) — single-writer brain, sensor/sink tasks, store"
license = "MIT"

[dependencies]
doorbell-core = { path = "../doorbell-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bd-qrmw: typed library errors (thiserror) — anyhow is gone from this crate.
thiserror = "1"
chrono = "0.4"
# bd-ene2 FileHost: gen-hash (sha1 of first 8k, same rule as the embedded
# WatcherGen gate) + home-dir fallback for the toron data root.
sha1 = "0.10"
hex = "0.4"
dirs = "6"
libc = "0.2"

[dev-dependencies]
# start_paused slow-dispatch tests substitute the clock (bd-zzgb).
tokio = { version = "1", features = ["test-util"] }
