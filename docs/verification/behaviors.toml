# Behavior ledger (bd-ksbtp, epic bd-jp9z1).
#
# One entry per behavior a reviewer would want proof for. The gate
# (scripts/verify-coverage.sh) checks that every referenced test exists, every
# mutation/spec file exists, and that each behavior has >=1 test and >=1
# mutation. It is wired into scripts/clean-proof.sh.
#
# status = "proven"  : test + mutation landed and were seen RED
# status = "pending" : behavior known, proof not yet landed (reported, not failed)
#
# concurrent = true means the behavior is a protocol with a race; such an entry
# MUST name a formal model (TLA model+cfg, or a workflow-verify chart).

