[package]
name = "flywheel"
version = "0.2.0"
edition = "2021"
description = "Multi-agent swarm orchestrator on the herdr backend — NTM-parity daily loop for opencode/pi/grok"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
dotenvy = "0.15"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
serde_json = "1"
toml = "0.8"
regex-lite = "0.1"
ureq = { version = "2", features = ["json"] }
resonate-sdk = "0.6.0"

[features]
# Default build: the `serve` HTTP surface + the two default backends (herdr
# multiplexer + agent-mail mail). Optional backends (superlogical/tmux/toron)
# are opt-in; their stub impls land in bd-toron-superlogical-stubs (R0.7), and
# their heavy deps (nostr-sdk etc.) only pull when enabled.
default = ["serve", "backend-herdr", "mail-agentmail"]
serve = ["dep:axum", "dep:tokio-stream", "dep:futures-core"]
# Multiplexer backends (ADR-0002)
backend-herdr = []
backend-superlogical = []
backend-tmux = []
# Mail backends (ADR-0002)
mail-agentmail = []
mail-toron = []

[dependencies.axum]
version = "0.8"
optional = true

[dependencies.futures-core]
version = "0.3"
optional = true

# tokio is a HARD dep: the durable loop + leaves (cmd_loop, __poll/__send)
# create a tokio Runtime unconditionally (src/main.rs:2541,3387,3849). Only the
# HTTP serve surface (axum + stream/futures helpers) is feature-gated.
[dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "macros", "net", "time"]

[dependencies.tokio-stream]
version = "0.1"
optional = true

[profile.release]
strip = true
lto = true
