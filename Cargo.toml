[package]
name = "flywheel"
version = "0.4.0"
edition = "2024"
description = "Multi-agent swarm orchestrator on the herdr backend — NTM-parity daily loop for opencode/pi/grok"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
dotenvy = "0.15"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
sha1 = "0.10"
sha2 = "0.10"
serde_json = "1"
evalexpr = "13.1.0"
toml = "0.8"
regex-lite = "0.1"
ureq = { version = "2", features = ["json"] }
resonate-sdk = "0.6.0"
# In-process toron integration (ADR-0003 Decision 3A, bd-o8j.1): flywheel
# embeds toron-core's mailbox + toron-mcp's server surface with zero IPC.
# se2.3: deps re-pointed from the stale toron-head snapshot to the live
# workspace — the MailSurface extension (R1 + se2.3) lives on main.
toron-core = { path = "../toron/crates/toron-core" }
toron-mcp = { path = "../toron/crates/toron-mcp" }
# The unified durable workflow engine (ADR-0005 Spec 2, P3.1): flywheel routes
# ALL workflow execution through toron-workflow's WorkflowEngine. This is the
# cargo edge the tier diagram always implied but no Cargo.toml wired.
toron-workflow = { path = "../toron/crates/toron-workflow" }
async-trait = "0.1"
cron = "0.17.0"
chrono = "0.4.45"
# ADR-0007 D4: catalog ratatui hub + TTY multi-select.
ratatui = "0.29"
crossterm = "0.28"
dialoguer = "0.11"

[features]
# Default build: the `serve` HTTP surface + herdr multiplexer + BOTH mail
# backends (toron is the default selection; agent-mail remains compiled in as
# opt-in via FLYWHEEL_MAIL). Optional multiplexers (superlogical/tmux) are
# opt-in; their stub impls land in bd-toron-superlogical-stubs (R0.7).
default = ["serve", "backend-herdr", "mail-agentmail", "mail-toron"]
serve = ["dep:axum", "dep:tokio-stream", "dep:futures-core"]
# Multiplexer backends (ADR-0002)
backend-herdr = []
backend-superlogical = []
backend-tmux = []
# Mail backends (ADR-0002)
mail-agentmail = []
mail-toron = []

[dependencies.axum]
version = "0.8"
optional = true

[dependencies.futures-core]
version = "0.3"
optional = true

# tokio is a HARD dep: the durable loop + leaves (cmd_loop, __poll/__send)
# create a tokio Runtime unconditionally (src/main.rs:2541,3387,3849). Only the
# HTTP serve surface (axum + stream/futures helpers) is feature-gated.
[dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal"]

[dependencies.tokio-stream]
version = "0.1"
optional = true

[dev-dependencies]
serde_json = "1"
tempfile = "3.27.0"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toron-core = { path = "../toron/crates/toron-core" }

[profile.release]
strip = true
lto = true

[lints.clippy]
# Shared lint posture with sibling beads (bd-14ea): pedantic + nursery deny
# with targeted allows. `all` deny predates the alignment and stays.
# Deviation from beads: no [lints.rust] unsafe_code deny — flywheel carries
# 116 `unsafe { env::set_var/remove_var }` sites (edition-2024 requirement,
# mostly single-threaded tests), so deny would need 100+ carve-outs.
all = "deny"
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Allow these lints to unblock CI (need higher priority than groups)
cast_precision_loss = { level = "allow", priority = 1 }
doc_markdown = { level = "allow", priority = 1 }
missing_const_for_fn = { level = "allow", priority = 1 }
uninlined_format_args = { level = "allow", priority = 1 }
useless_let_if_seq = { level = "allow", priority = 1 }
format_push_string = { level = "allow", priority = 1 }
# Stylistic nursery/pedantic lints that don't reflect real defects
assert_is_empty = { level = "allow", priority = 1 }
option_if_let_else = { level = "allow", priority = 1 }
map_unwrap_or = { level = "allow", priority = 1 }
similar_names = { level = "allow", priority = 1 }
too_long_first_doc_paragraph = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
redundant_clone = { level = "allow", priority = 1 }
struct_excessive_bools = { level = "allow", priority = 1 }
if_not_else = { level = "allow", priority = 1 }
# bd-14ea wave 2: mechanical churn across the single-binary codebase.
# `clippy --fix` cleared ~800 sites; the rest are allowed, not fixed, to
# keep this alignment commit reviewable. Tighten one lint at a time later.
default_trait_access = { level = "allow", priority = 1 }
use_self = { level = "allow", priority = 1 }
redundant_closure_for_method_calls = { level = "allow", priority = 1 }
needless_raw_string_hashes = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }
items_after_statements = { level = "allow", priority = 1 }
redundant_pub_crate = { level = "allow", priority = 1 }
needless_pass_by_value = { level = "allow", priority = 1 }
unnecessary_wraps = { level = "allow", priority = 1 }
match_same_arms = { level = "allow", priority = 1 }
single_match_else = { level = "allow", priority = 1 }
derive_partial_eq_without_eq = { level = "allow", priority = 1 }
assigning_clones = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
manual_let_else = { level = "allow", priority = 1 }
or_fun_call = { level = "allow", priority = 1 }
branches_sharing_code = { level = "allow", priority = 1 }
literal_string_with_formatting_args = { level = "allow", priority = 1 }
case_sensitive_file_extension_comparisons = { level = "allow", priority = 1 }
explicit_iter_loop = { level = "allow", priority = 1 }
fn_params_excessive_bools = { level = "allow", priority = 1 }
unreadable_literal = { level = "allow", priority = 1 }
significant_drop_tightening = { level = "allow", priority = 1 }
significant_drop_in_scrutinee = { level = "allow", priority = 1 }
unused_self = { level = "allow", priority = 1 }
used_underscore_binding = { level = "allow", priority = 1 }
used_underscore_items = { level = "allow", priority = 1 }
needless_collect = { level = "allow", priority = 1 }
match_wildcard_for_single_variants = { level = "allow", priority = 1 }
match_wild_err_arm = { level = "allow", priority = 1 }
iter_on_single_items = { level = "allow", priority = 1 }
iter_with_drain = { level = "allow", priority = 1 }
trivially_copy_pass_by_ref = { level = "allow", priority = 1 }
needless_pass_by_ref_mut = { level = "allow", priority = 1 }
unnecessary_debug_formatting = { level = "allow", priority = 1 }
needless_continue = { level = "allow", priority = 1 }
tuple_array_conversions = { level = "allow", priority = 1 }
implicit_hasher = { level = "allow", priority = 1 }
ref_option = { level = "allow", priority = 1 }
comparison_chain = { level = "allow", priority = 1 }
nonminimal_bool = { level = "allow", priority = 1 }
overly_complex_bool_expr = { level = "allow", priority = 1 }
semicolon_if_nothing_returned = { level = "allow", priority = 1 }
unnested_or_patterns = { level = "allow", priority = 1 }
redundant_else = { level = "allow", priority = 1 }
needless_bool = { level = "allow", priority = 1 }
manual_assert = { level = "allow", priority = 1 }
manual_string_new = { level = "allow", priority = 1 }
single_char_pattern = { level = "allow", priority = 1 }
single_char_add_str = { level = "allow", priority = 1 }
duration_suboptimal_units = { level = "allow", priority = 1 }
needless_borrow = { level = "allow", priority = 1 }
implicit_clone = { level = "allow", priority = 1 }
bool_to_int_with_if = { level = "allow", priority = 1 }
enum_glob_use = { level = "allow", priority = 1 }
range_plus_one = { level = "allow", priority = 1 }
unnecessary_trailing_comma = { level = "allow", priority = 1 }
# Integer casts in wire/backend code (port truncation/wrap/sign-loss).
# Real portability notes on 64-bit-only targets; allowed with the same
# rationale as cast_precision_loss above. Audit before any 32-bit target.
cast_possible_truncation = { level = "allow", priority = 1 }
cast_possible_wrap = { level = "allow", priority = 1 }
cast_sign_loss = { level = "allow", priority = 1 }
cast_lossless = { level = "allow", priority = 1 }
# Result/Option ergonomics in the orchestration layer
manual_ok_err = { level = "allow", priority = 1 }
redundant_closure = { level = "allow", priority = 1 }
field_reassign_with_default = { level = "allow", priority = 1 }
ignored_unit_patterns = { level = "allow", priority = 1 }
