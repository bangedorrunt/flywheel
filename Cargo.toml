[package]
name = "flywheel"
version = "0.8.0"
edition = "2024"
description = "Multi-agent swarm orchestrator on the herdr backend — NTM-parity daily loop for opencode/pi/grok"
license = "MIT"

[workspace]
members = ["crates/doorbell-core", "crates/doorbell-rt", "crates/doorbell-cli"]
# default-members: the root package is implied, so without this a bare
# `cargo test` at the root ran ONLY flywheel and the doorbell crates' tests
# (doorbell-rt's brain/sinks, doorbell-cli's lifecycle) silently never ran.
# Listing them makes the documented `mbx +nightly-aarch64-apple-darwin test`
# cover the whole workspace — the same four-package fence
# scripts/verify-clippy.sh applies to the lint gates (bd-hj36).
default-members = [
    ".",
    "crates/doorbell-core",
    "crates/doorbell-rt",
    "crates/doorbell-cli",
]

[dependencies]
doorbell-core = { path = "crates/doorbell-core" }
doorbell-rt = { path = "crates/doorbell-rt" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
dotenvy = "0.15"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
sha1 = "0.10"
sha2 = "0.10"
serde_json = "1"
evalexpr = "13.1.0"
toml = "0.8"
regex-lite = "0.1"
ureq = { version = "2", features = ["json"] }
resonate-sdk = "0.6.0"
# In-process toron integration (ADR-0003 Decision 3A, bd-o8j.1): flywheel
# embeds toron-core's mailbox + toron-mcp's server surface with zero IPC.
# se2.3: deps re-pointed from the stale toron-head snapshot to the live
# workspace — the MailSurface extension (R1 + se2.3) lives on main.
toron-core = { path = "../toron/crates/toron-core" }
toron-mcp = { path = "../toron/crates/toron-mcp" }
# The unified durable workflow engine (ADR-0005 Spec 2, P3.1): flywheel routes
# ALL workflow execution through toron-workflow's WorkflowEngine. This is the
# cargo edge the tier diagram always implied but no Cargo.toml wired.
toron-workflow = { path = "../toron/crates/toron-workflow" }
# rv23 #4: one point read of the inbox head row by its offset (the urgency
# check), on the pool `InboxStore::pool` exposes. Same version as toron-core.
sqlx = { version = "0.8", default-features = false, features = ["sqlite"] }
async-trait = "0.1"
cron = "0.17.0"
chrono = "0.4.45"
# ADR-0007 D4: catalog ratatui hub + TTY multi-select.
ratatui = "0.29"
crossterm = "0.28"
dialoguer = "0.11"

[features]
# Default build: the `serve` HTTP surface + herdr multiplexer + toron mail
# (the only mail backend since bd-euav; selected via FLYWHEEL_MAIL=toron).
# Optional multiplexer (superlogical) is
# opt-in; its stub impl lands in bd-toron-superlogical-stubs (R0.7).
default = ["serve", "backend-herdr", "mail-toron"]
serve = ["dep:axum", "dep:tokio-stream", "dep:futures-core"]
# Multiplexer backends (ADR-0002)
backend-herdr = []
backend-superlogical = []
# Mail backends (ADR-0002, bd-euav single-backend: toron only)
mail-toron = []
# Live-test only (build-plan §5): toron's outbox crash points,
# `TORON_FAULT=after_intent|after_append` aborts between journal and append.
fault-injection = ["toron-core/fault-injection"]

[dependencies.axum]
version = "0.8"
optional = true

[dependencies.futures-core]
version = "0.3"
optional = true

# tokio is a HARD dep: the durable loop + leaves (cmd_loop, __poll/__send)
# create a tokio Runtime unconditionally (src/main.rs:2541,3387,3849). Only the
# HTTP serve surface (axum + stream/futures helpers) is feature-gated.
[dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal"]

[dependencies.tokio-stream]
version = "0.1"
optional = true

[dev-dependencies]
serde_json = "1"
tempfile = "3.27.0"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toron-core = { path = "../toron/crates/toron-core" }

# Dependency debuginfo is the dominant cost of a cold dev build and of every
# relink, and none of it is read: a panic in a dependency still resolves to a
# line table, which is all a backtrace needs. Full debuginfo for deps was the
# default here because no repo set a `[profile.dev.package]` override.
[profile.dev.package."*"]
debug = "line-tables-only"

[profile.release]
# strip disabled (bd-lpho): the floating nightly's strip pass mis-aligns
# proc-macro dylib LINKEDIT (libsqlx_macros dlopen fails), breaking every
# release build/install. Re-enable after repinning past the bad nightly or
# verifying a fixed toolchain. Cost: ~1MB larger binary, no behavior change.
strip = false
lto = true
